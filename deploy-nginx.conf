# Save as /etc/nginx/sites-available/suvarna-mitra, then:
#   sudo ln -s /etc/nginx/sites-available/suvarna-mitra /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com      (HTTPS is required for the live-camera step)
server {
    listen 80;
    server_name yourdomain.com;

    client_max_body_size 10m;

    root /var/www/suvarna-mitra;      # the contents of frontend/dist
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
